name: App Store submit

# Sends an already-uploaded App Store Connect build to App Review (iPhone/iPad and the Mac app), using
# tools/release/appstore_submit.py. The release workflow does this by itself after every tag; this one is for
# retrying (for example after adding a missing screenshot in App Store Connect) or for checking the state.
# With "submit" off it only reads and prints what it would do.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App Store version, e.g. 1.3.0 (MARKETING_VERSION in ios/project.yml)"
        required: true
      build:
        description: "Build number that is already uploaded, e.g. 4 (CURRENT_PROJECT_VERSION)"
        required: true
      notes:
        description: "Release notes folder, e.g. 0.6.0 (reads release/<folder>/appstore.txt)"
        required: true
      submit:
        description: "Really submit for review (off = read-only)"
        type: boolean
        default: false
      release_pending:
        description: "First RELEASE an older version Apple approved that still waits for you (Pending Developer Release). Public!"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  submit:
    name: App Store review
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - name: Run
        run: |
          set -euo pipefail
          [ -n "$APPSTORE_KEY_P8" ] || { echo "::error::the App Store Connect key isn't configured"; exit 1; }
          KEY="$RUNNER_TEMP/AuthKey_$APPSTORE_KEY_ID.p8"
          printf '%s' "$APPSTORE_KEY_P8" > "$KEY"; chmod 600 "$KEY"
          trap 'rm -f "$KEY"' EXIT
          args=(--version "${{ inputs.version }}" --build "${{ inputs.build }}" --notes "release/${{ inputs.notes }}/appstore.txt")
          [ "${{ inputs.submit }}" = true ] && args+=(--submit)
          [ "${{ inputs.release_pending }}" = true ] && args+=(--release-pending)
          ASC_KEY_ID="$APPSTORE_KEY_ID" ASC_ISSUER_ID="$APPSTORE_ISSUER_ID" ASC_KEY_PATH="$KEY" \
            python3 tools/release/appstore_submit.py "${args[@]}"
