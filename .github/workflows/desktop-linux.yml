name: Desktop (Linux)

# Builds the Linux packages for the :desktop app: a .deb (Ubuntu, Debian, Mint, Pop!_OS…), an .rpm (Fedora, openSUSE…)
# and a portable .tar.gz that runs on any x86-64 distribution (it carries its own Java runtime). jpackage can only
# build a package on the OS it targets, so this is where they are made — and where the same :core and :desktop test
# suites that pass on macOS and Windows run on Linux, under a virtual display (Xvfb).
#
# After building, the .deb is really installed and the installed app is started: it must open its window and answer
# on its transfer port. That catches what unit tests cannot: a missing Java module in the bundled runtime, a missing
# system library, a broken launcher.
#
# Run it by hand (Actions -> "Desktop (Linux)" -> Run workflow), push a tag named desktop-v*, or open a pull
# request that touches the desktop app. The packages are only attached to the run as a downloadable artifact (kept
# 90 days) — nothing is published or released automatically. They are UNSIGNED.

on:
  workflow_dispatch:
  workflow_call:        # release.yml builds the packages through this
  push:
    tags: ["desktop-v*"]
  pull_request:
    paths:
      - "desktop/**"
      - "core/**"
      - "gradle/**"
      - "l10n/**"
      - "app/src/main/java/com/crossdrop/ui/**"   # shared UI is copied into :desktop at build time
      - "app/src/main/java/com/crossdrop/net/TransferHub.kt"
      - ".github/workflows/desktop-linux.yml"

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  linux:
    name: Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"          # a full JDK: jpackage ships with it

      - uses: gradle/actions/setup-gradle@v4

      # Xvfb: a virtual screen for the Compose UI tests and the smoke test. fakeroot + dpkg-dev: jpackage's .deb.
      # rpm: its .rpm (rpmbuild). The lib* packages are what Skia / AWT load at runtime. x11-utils: xwininfo.
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb x11-utils fakeroot dpkg-dev rpm \
            libgl1 libfontconfig1 libxtst6 libxrender1 libxi6 libxrandr2 zenity xdg-utils

      # --configure-on-demand: only :core and :desktop are configured, so the Android module (and the Android SDK
      # it needs) is not involved. --continue runs every suite even if one fails.
      - name: Test
        env:
          JAVA_TOOL_OPTIONS: "-Dcrossdrop.debug=1"
        run: xvfb-run -a ./gradlew --configure-on-demand :core:test :desktop:test --continue --info --stacktrace

      # The steps below run even when a test failed (the job still ends red), so a candidate package exists while the
      # failure is investigated. Nothing is published from here either way.
      - name: Package .deb, .rpm and the app image
        if: ${{ !cancelled() }}
        run: ./gradlew --configure-on-demand :desktop:packageDeb :desktop:packageRpm :desktop:createDistributable --stacktrace

      - name: Portable .tar.gz
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          app=desktop/build/compose/binaries/main/app
          [ -x "$app/CrossDrop/bin/CrossDrop" ] || { echo "::error::app image not found under $app"; find desktop/build/compose/binaries -maxdepth 3; exit 1; }
          mkdir -p desktop/build/linux-portable
          tar -C "$app" -czf desktop/build/linux-portable/CrossDrop-linux-x64.tar.gz CrossDrop

      - name: Package contents and sizes
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          ls -lh desktop/build/compose/binaries/main/deb/*.deb desktop/build/compose/binaries/main/rpm/*.rpm desktop/build/linux-portable/*.tar.gz
          deb=$(ls desktop/build/compose/binaries/main/deb/*.deb)
          dpkg-deb --info "$deb"
          dpkg-deb -c "$deb" | grep -E "\.desktop|bin/CrossDrop|\.png" || true
          rpm -qpi desktop/build/compose/binaries/main/rpm/*.rpm | head -12

      # Install the real package and start the installed app, as a user would (tools/release/linux_smoke.sh).
      - name: Smoke test — install the .deb and start the app
        if: ${{ !cancelled() }}
        run: tools/release/linux_smoke.sh desktop/build/compose/binaries/main/deb/*.deb

      # The .rpm on a clean Fedora (a docker image on the runner): its dependencies must pull in everything the app loads.
      - name: Smoke test — install the .rpm on Fedora and start the app
        if: ${{ !cancelled() }}
        run: |
          docker run --rm \
            -v "$PWD/tools/release:/tools:ro" \
            -v "$PWD/desktop/build/compose/binaries/main/rpm:/rpm:ro" \
            fedora:41 /tools/linux_smoke_rpm.sh

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: CrossDrop-linux
          if-no-files-found: error
          path: |
            desktop/build/compose/binaries/main/deb/*.deb
            desktop/build/compose/binaries/main/rpm/*.rpm
            desktop/build/linux-portable/*.tar.gz
