name: Desktop (Windows)

# Builds the Windows installers for the :desktop app. jpackage can only produce an
# MSI/EXE on Windows (it needs WiX), so this is how the Windows build is made and
# verified — the same :core and :desktop test suites that pass on macOS run here too.
#
# Run it by hand (Actions -> "Desktop (Windows)" -> Run workflow) or push a tag named
# desktop-v*. Either way the installers are only attached to the run as a downloadable
# artifact (kept 90 days) — nothing is published or released automatically. They are
# UNSIGNED: Windows SmartScreen warns on first run until they are code-signed.

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]
  pull_request:
    paths:
      - "desktop/**"
      - "core/**"
      - "gradle/**"
      - "app/src/main/java/com/crossdrop/ui/**"   # shared UI is copied into :desktop at build time
      - ".github/workflows/desktop-windows.yml"

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"          # a full JDK: jpackage ships with it

      - uses: gradle/actions/setup-gradle@v4

      # --configure-on-demand: only :core and :desktop are configured, so the Android
      # module (and the Android SDK it needs) is not involved.
      # --continue runs every suite even if one fails; --info plus the app's debug logging puts each
      # failing test's stdout/stderr (and the app's own log lines) into the job log.
      - name: Test
        shell: pwsh
        env:
          JAVA_TOOL_OPTIONS: "-Dcrossdrop.debug=1"
        run: .\gradlew.bat --configure-on-demand :core:test :desktop:test --continue --info --stacktrace

      # The steps below run even when a test failed (the job still ends red), so a candidate installer
      # exists while the failure is investigated. Nothing is published from here either way.
      # jpackage needs WiX 3.x (candle.exe / light.exe) on PATH to build an MSI.
      - name: Put WiX on PATH
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $bin = if ($env:WIX) { Join-Path $env:WIX "bin" } else { $null }
          if (-not ($bin -and (Test-Path (Join-Path $bin "candle.exe")))) {
            choco install wixtoolset --no-progress -y
            $bin = "C:\Program Files (x86)\WiX Toolset v3.14\bin"
          }
          if (-not (Test-Path (Join-Path $bin "candle.exe"))) { throw "WiX not found at $bin" }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "WiX: $bin"

      - name: Package MSI and EXE
        if: ${{ !cancelled() }}
        shell: pwsh
        run: .\gradlew.bat --configure-on-demand :desktop:packageMsi :desktop:packageExe --stacktrace

      # MSIX for the Microsoft Store. Unlike the MSI/EXE this needs no signing certificate: the Store
      # re-signs what you upload. The identity in AppxManifest.xml must match Partner Center exactly.
      - name: Build MSIX (Microsoft Store)
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          .\gradlew.bat --configure-on-demand :desktop:createDistributable --stacktrace
          $exe = Get-ChildItem desktop/build/compose/binaries/main/app -Recurse -Filter CrossDrop.exe | Select-Object -First 1
          if (-not $exe) { throw "app image (CrossDrop.exe) not found under desktop/build/compose/binaries/main/app" }
          $app = $exe.Directory.FullName

          # MSIX version follows APP_VERSION, 0.x.y -> 1.x.y.0 (the Store reserves the 4th part).
          $src = Get-Content desktop/src/main/kotlin/com/crossdrop/Main.kt -Raw
          $m = [regex]::Match($src, 'APP_VERSION\s*=\s*"(\d+)\.(\d+)\.(\d+)"')
          if (-not $m.Success) { throw "APP_VERSION not found in Main.kt" }
          $version = "{0}.{1}.{2}.0" -f [Math]::Max([int]$m.Groups[1].Value, 1), $m.Groups[2].Value, $m.Groups[3].Value

          $layout = Join-Path $PWD "build/msix-layout"
          if (Test-Path $layout) { Remove-Item $layout -Recurse -Force }
          Copy-Item $app $layout -Recurse
          Copy-Item desktop/packaging/msix/Assets (Join-Path $layout "Assets") -Recurse
          (Get-Content desktop/packaging/msix/AppxManifest.xml -Raw).Replace("@VERSION@", $version) |
            Set-Content (Join-Path $layout "AppxManifest.xml") -Encoding utf8

          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter makeappx.exe |
            Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $makeappx) { throw "makeappx.exe not found (Windows SDK)" }
          New-Item -ItemType Directory -Force desktop/build/msix | Out-Null
          $out = Join-Path $PWD "desktop/build/msix/CrossDrop_${version}_x64.msix"
          & $makeappx.FullName pack /d $layout /p $out /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx failed ($LASTEXITCODE)" }
          Write-Host "MSIX: $out"

      - name: Installer sizes
        if: ${{ !cancelled() }}
        shell: pwsh
        run: Get-ChildItem desktop/build/compose/binaries/main/msi, desktop/build/compose/binaries/main/exe, desktop/build/msix -Include *.msi,*.exe,*.msix -Recurse | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: CrossDrop-windows
          if-no-files-found: error
          path: |
            desktop/build/compose/binaries/main/msi/*.msi
            desktop/build/compose/binaries/main/exe/*.exe
            desktop/build/msix/*.msix
