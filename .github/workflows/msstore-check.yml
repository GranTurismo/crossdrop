name: Microsoft Store check

# Read-only: logs into the Microsoft Store API with the repository's Partner Center credentials and reads the
# CrossDrop product. Run it by hand (Actions -> Microsoft Store check) to prove the credentials still work, e.g.
# before a release or after the client secret was renewed. It changes nothing in Partner Center.

on:
  workflow_dispatch:
    inputs:
      msix_run_id:
        description: "Optional write test: the id of a workflow run whose CrossDrop-windows artifact holds an .msix with a version HIGHER than the live one. It is uploaded as a draft through the API and the draft is deleted again; nothing is submitted."
        required: false
        default: ""

permissions:
  contents: read
  actions: read     # to download that artifact

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      STORE_PRODUCT_ID: 9PBRFPV9GD7P
      AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
      AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
      AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
      SELLER_ID: ${{ secrets.SELLER_ID }}
    steps:
      - uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Connect to Partner Center
        shell: pwsh
        run: |
          msstore reconfigure --tenantId $env:AZURE_AD_TENANT_ID --sellerId $env:SELLER_ID --clientId $env:AZURE_AD_APPLICATION_CLIENT_ID --clientSecret $env:AZURE_AD_APPLICATION_SECRET
          if ($LASTEXITCODE -ne 0) { throw "msstore reconfigure failed" }

      - name: Read the product
        shell: pwsh
        run: |
          msstore apps get $env:STORE_PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { throw "couldn't read the product (check the app's role in Partner Center)" }

      - name: Read the current submission
        shell: pwsh
        run: |
          msstore submission status $env:STORE_PRODUCT_ID
          if ($LASTEXITCODE -ne 0) { throw "couldn't read the submission status" }

      # Proves the app's role in Partner Center is enough to WRITE, not just read. The draft is always removed.
      - name: Write test (draft upload, then delete)
        if: ${{ inputs.msix_run_id != '' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.msix_run_id }}
        run: |
          gh run download $env:RUN_ID --repo $env:GITHUB_REPOSITORY -n CrossDrop-windows -D msix-test
          $msix = Get-ChildItem msix-test -Recurse -Filter *.msix | Select-Object -First 1
          if (-not $msix) { throw "no .msix in run $env:RUN_ID" }
          Write-Host "uploading $($msix.Name) as a draft (not submitted)"
          msstore publish $msix.FullName -id $env:STORE_PRODUCT_ID --noCommit
          $uploaded = $LASTEXITCODE
          msstore submission status $env:STORE_PRODUCT_ID
          # The same read-modify-write the release uses to set "What's new" (but never committed).
          if ($uploaded -eq 0) {
            $submission = msstore submission get $env:STORE_PRODUCT_ID | ConvertFrom-Json
            $submission.Listings.'en-us'.BaseListing.ReleaseNotes = "write test (this draft is deleted, never submitted)"
            msstore submission update $env:STORE_PRODUCT_ID ($submission | ConvertTo-Json -Depth 100 -Compress)
            $uploaded = $LASTEXITCODE
          }
          # Always clean up the draft, whether or not the upload worked.
          msstore submission delete $env:STORE_PRODUCT_ID --no-confirm
          if ($uploaded -ne 0) { throw "the draft upload failed (exit $uploaded): the app's role probably can't write; widen it to Manager in Partner Center" }
          Write-Host "write access confirmed; the draft was deleted."
