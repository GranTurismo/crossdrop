<!doctype html><meta charset="utf-8">
<style>
  body{margin:0;background:#111;color:#9af;font:12px system-ui;padding:24px}
  .row{display:flex;gap:24px;align-items:end;margin-bottom:28px}
  .cell{text-align:center}
  .cell div{margin-bottom:6px;opacity:.6}
  img{display:block}
  .circle{border-radius:50%}
  .squircle{border-radius:28%}
  .rounded{border-radius:12%}
  .launcher{background:linear-gradient(160deg,#1a1440,#0a0620);padding:14px;border-radius:16px}
</style>
<div class="row launcher">
  <div class="cell"><div>full bleed 192</div><img src="icon.svg" width="192"></div>
  <div class="cell"><div>circle mask</div><img src="icon.svg" width="192" class="circle"></div>
  <div class="cell"><div>squircle</div><img src="icon.svg" width="192" class="squircle"></div>
  <div class="cell"><div>rounded sq</div><img src="icon.svg" width="192" class="rounded"></div>
</div>
<div class="row launcher">
  <div class="cell"><div>96px</div><img src="icon.svg" width="96" class="squircle"></div>
  <div class="cell"><div>72px</div><img src="icon.svg" width="72" class="squircle"></div>
  <div class="cell"><div>48px</div><img src="icon.svg" width="48" class="squircle"></div>
  <div class="cell"><div>36px</div><img src="icon.svg" width="36" class="squircle"></div>
</div>
<div class="row launcher">
  <div class="cell"><div>mono sim</div><img src="icon.svg" width="96" class="squircle" style="filter:grayscale(1) contrast(1.4)"></div>
  <div class="cell"><div>24dp notif size</div><img src="icon.svg" width="24"></div>
</div>
