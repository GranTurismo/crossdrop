name: CrossDrop
options:
  bundleIdPrefix: com.granturismo
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.6.1"
    CURRENT_PROJECT_VERSION: "8"
    DEVELOPMENT_TEAM: C58ABB3474
    CODE_SIGN_STYLE: Automatic
packages:
  CrossDropCore:
    path: CrossDropCore
targets:
  CrossDrop:
    type: application
    supportedDestinations: [iOS, macCatalyst]
    sources:
      - path: CrossDrop
      # Translations shared with Android and desktop: l10n/<lang>.json, read by Services/I18n.swift.
      - path: ../l10n
        type: folder
    dependencies:
      - package: CrossDropCore
      - target: CrossDropShare
    info:
      path: CrossDrop/Info.plist
      properties:
        CFBundleDisplayName: CrossDrop
        # The languages CrossDrop is translated into: iOS lists them under Settings > CrossDrop > Language.
        CFBundleLocalizations: [en, ka, hi, id, ar, fa, es, pt-BR, ru, tr]
        # Without these XcodeGen writes a literal 1.0 / 1 and MARKETING_VERSION is ignored.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchMark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSApplicationCategoryType: public.app-category.utilities
        ITSAppUsesNonExemptEncryption: false   # encryption only via Apple CryptoKit; matches the export-compliance answer in App Store Connect
        UIUserInterfaceStyle: Dark
        # Sonar type: Sora (display) + JetBrains Mono (figures), Latin subsets, SemiBold only.
        # OFL notice ships next to them (Resources/Fonts/FONTS-OFL.txt). Also read by Mac Catalyst.
        UIAppFonts:
          - Sora-SemiBold.ttf
          - JetBrainsMono-SemiBold.ttf
        NSLocalNetworkUsageDescription: CrossDrop uses your local network to find nearby devices and send files directly to them — nothing leaves your Wi-Fi.
        NSBonjourServices:
          - _crossdrop._tcp
          - _crossdrop-vault._tcp
        NSCameraUsageDescription: CrossDrop uses the camera to scan another phone's code, and to send the photos and videos you take to the devices you pick.
        NSMicrophoneUsageDescription: Sound for the videos you record in CrossDrop's camera.
        NSPhotoLibraryUsageDescription: To switch phones, CrossDrop reads your photos and videos and moves them straight to your other device.
        NSPhotoLibraryAddUsageDescription: CrossDrop saves photos and videos it receives — and the ones you take in its camera — to your library.
        NSContactsUsageDescription: To switch phones, CrossDrop copies your contacts straight to your other device, and adds contacts moved here from another phone.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDocumentTypes:
          - CFBundleTypeName: Any file
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.item
              - public.data
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.granturismo.crossdrop
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        # iPhone/iPad: Hotspot Configuration ("Scan a code" joins another phone's private link).
        CODE_SIGN_ENTITLEMENTS[sdk=iphone*]: CrossDrop/CrossDrop.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: CrossDrop/CrossDrop-Mac.entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
  # Share → CrossDrop from any app (iPhone, iPad, Mac): finds devices and sends from inside the extension.
  CrossDropShare:
    type: app-extension
    supportedDestinations: [iOS, macCatalyst]
    sources:
      - path: CrossDropShare
    dependencies:
      - package: CrossDropCore
    info:
      path: CrossDropShare/Info.plist
      properties:
        CFBundleDisplayName: CrossDrop
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: CrossDrop uses your local network to find nearby devices and send to them directly — nothing leaves your Wi-Fi.
        NSBonjourServices:
          - _crossdrop._tcp
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 100
              NSExtensionActivationSupportsImageWithMaxCount: 100
              NSExtensionActivationSupportsMovieWithMaxCount: 100
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.granturismo.crossdrop.share
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: CrossDropShare/CrossDropShare-Mac.entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  CrossDrop:
    build:
      targets:
        CrossDrop: all
    run:
      config: Debug
